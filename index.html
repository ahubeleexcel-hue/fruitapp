<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="Appcontent">
            <h2>Guess The Fruit Game</h2>
            <p class="qtn">Can you guess the fruit i am thinking of?</p>
            <div class="inputdiv">
                <input type="text" id="guessfruit" placeholder="Enter your guess here">
                <button class="btn">Submit</button>
            </div>

            <div class="remarkcontainer">
                <div class="remark">
                    <p class="remarkstatement">wow you guessed right</p>
                </div>
            </div>

            <div class="resultcontainer">
                <div class="result">
                    <p>The fruit i am thinking of is <span class="fruitname">Apple</span></p>
                </div>
            </div>

            <div class="imgdiv">
                <img src="apple.png" class="FruitImg">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
